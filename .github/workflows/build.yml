name: Build thelightasean Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode / xcrun info
        run: |
          xcode-select -p || true
          xcodebuild -version || true
          xcrun --version || true

      - name: Cài ldid
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew không có sẵn — runner có thể đã có brew; tiếp tục"
          fi
          brew install ldid || true

      - name: Build dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path) || { echo "Không tìm thấy iphoneos SDK"; exit 1; }
          echo "Using SDK: $SDK"
          mkdir -p output
          if [ ! -f thelightasean.c ]; then
            echo "Không tìm thấy thelightasean.c trong repo. Kiểm tra đường dẫn hoặc tên file."; ls -la; exit 1;
          fi
          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -dynamiclib -O2 -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -lpthread \
            -o output/thelightasean.dylib \
            thelightasean.c
          # Sign the dylib for device usage (ldid may be optional on CI)
          if command -v ldid >/dev/null 2>&1; then
            ldid -S output/thelightasean.dylib || true
          fi
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: thelightasean-dylib
          path: output/thelightasean.dylib
          retention-days: 30
