# ============================================================
# FILE: .github/workflows/build.yml
# BẢN SỬA LỖI – BUILD TRỰC TIẾP KHÔNG DÙNG THEOS
# CHẠY TRÊN GITHUB ACTIONS (macos-latest)
# ============================================================
name: Build Tweak FF2019 Jailbreak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra file nguồn
        run: |
          ls -la
          test -f ff2019_jailbreak_all_in_one.c && echo "OK: có file nguồn" || exit 1

      - name: Build dylib bằng clang
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          mkdir -p output
          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -dynamiclib -O2 \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -lpthread \
            -o output/thelightasean.dylib \
            ff2019_jailbreak_all_in_one.c
          ldid -S output/thelightasean.dylib || true
          file output/thelightasean.dylib
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: thelightasean-dylib
          path: output/thelightasean.dylib
          retention-days: 30
