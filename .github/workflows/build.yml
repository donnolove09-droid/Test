name: Build thelightasean Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài ldid
        run: brew install ldid || true

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p output
          clang -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -dynamiclib -O2 -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -lpthread \
            -o output/thelightasean.dylib \
            thelightasean.c
          ldid -S output/thelightasean.dylib || true
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: thelightasean-dylib
          path: output/thelightasean.dylib
          retention-days: 30
